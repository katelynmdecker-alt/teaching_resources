<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 7: Projectile Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        .canvas-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); overflow: hidden; cursor: crosshair; }
        input[type="range"] { accent-color: #10b981; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex min-h-screen">
    <aside class="w-64 md:w-72 bg-white border-r border-slate-200 flex-shrink-0 hidden lg:flex flex-col shadow-sm sticky top-0 h-screen z-10">
        <div class="p-6 border-b border-slate-200"><h2 class="text-2xl font-black text-slate-800 tracking-tight">Module 2</h2><p class="text-sm text-slate-500 font-medium mt-1">Quadratics</p></div>
        <nav class="flex-1 overflow-y-auto p-4 space-y-2">
            <a href="module2_lesson1.html" class="block p-3 rounded-xl text-sm font-medium text-slate-600 hover:bg-emerald-50">1. Graphing &amp; Conversion</a>
            <a href="module2_lesson7.html" class="block p-3 rounded-xl text-sm bg-emerald-100 text-emerald-800 font-bold underline">7. Projectile Explorer</a>
        </nav>
    </aside>
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="mb-8 text-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-3xl font-bold text-slate-800">Projectile Motion Explorer</h1>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
                    <div class="mb-4"><label class="text-sm font-medium">Initial Height (c)</label><input type="range" id="initialHeight" min="0" max="200" value="50" class="w-full"></div>
                    <div class="mb-6"><label class="text-sm font-medium">Initial Velocity (b)</label><input type="range" id="initialVelocity" min="10" max="150" value="80" class="w-full"></div>
                    <button id="launchBtn" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700">🚀 Launch</button>
                </div>
            </div>
            <div class="lg:col-span-2"><div class="canvas-container h-[550px]" id="container"><canvas id="mainCanvas"></canvas></div></div>
        </div>
    </main>
    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let c = 50, b = 80, a = -16, t = 0, isAnimating = false;
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const px = 60 + t * (canvas.width-120)/5;
            const h = a*t*t + b*t + c;
            const py = canvas.height - 60 - h * (canvas.height-120)/200;
            ctx.beginPath(); ctx.fillStyle='#10b981'; ctx.arc(px, py, 10, 0, Math.PI*2); ctx.fill();
        }
        document.getElementById('launchBtn').onclick = () => { t=0; isAnimating=true; requestAnimationFrame(function anim(){ if(!isAnimating)return; t+=0.05; draw(); if(a*t*t+b*t+c < 0) isAnimating=false; else requestAnimationFrame(anim); }); };
        window.onresize = () => { canvas.width = document.getElementById('container').clientWidth; canvas.height = 550; draw(); };
        window.onresize();
    </script>
</body>
</html>
